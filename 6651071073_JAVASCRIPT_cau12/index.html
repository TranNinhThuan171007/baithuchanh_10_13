<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Passport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2>Checkbox Div Hide Show</h2>

  <section class="checkbox-card">
    <div class="question">Do You have Passport</div>
    <label class="choice"><input type="checkbox" class="checkme"> Yes</label>
    <div class="details" hidden>
      <input type="text" placeholder="Enter Passport Number">
      <a href="#">Apply For Passport</a>
    </div>
  </section>

  <section class="checkbox-card">
    <div class="question">Do You have Credit Card</div>
    <label class="choice"><input type="checkbox" class="checkme"> Yes</label>
    <div class="details" hidden>
      <input type="text" placeholder="Enter Credit Card Number">
      <a href="#">Apply For Credit Card</a>
    </div>
  </section>
  <script src="js/jquery-latest.min.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
