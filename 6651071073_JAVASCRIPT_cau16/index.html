<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Câu 16 - Quản lý thông tin người dùng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h2>Quản lý thông tin user</h2>
  <form id="user-form">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <input type="date" id="datepicker" aria-label="Birthdate" required>
    <button type="submit" class="add-row">Add Row</button>
  </form>
  <table>
    <thead><tr><th>Select</th><th>Name</th><th>Email</th><th>Birthdate</th></tr></thead>
    <tbody></tbody>
  </table>
  <button type="button" class="delete-row">Delete Row</button>
  <script src="js/jquery-latest.min.js"></script>
  <script src="script.js" defer></script>
</body>
</html>
